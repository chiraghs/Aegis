<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aegis — Legal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #eff3ed; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; border-radius: 20px; padding: 48px 40px; max-width: 480px; width: 90%; box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center; }
    .logo { font-size: 13px; font-weight: 900; letter-spacing: 2.5px; color: #4caf7d; margin-bottom: 6px; }
    h1 { font-size: 26px; font-weight: 900; color: #2b2b2b; letter-spacing: 0.5px; margin-bottom: 10px; }
    p { font-size: 14px; color: #5f685b; line-height: 1.6; margin-bottom: 32px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a { display: block; padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 700; text-decoration: none; transition: opacity 0.15s; }
    a:hover { opacity: 0.85; }
    .primary { background: #2b2b2b; color: #fff; }
    .secondary { background: #e2e7df; color: #2b2b2b; }
    .footer { margin-top: 28px; font-size: 11px; color: #8f988a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🛡 AEGIS</div>
    <h1>Legal</h1>
    <p>Personal finance, reimagined.<br>Read our policies below.</p>
    <div class="links">
      <a href="terms.html" class="primary">Terms of Service</a>
      <a href="privacy.html" class="secondary">Privacy Policy</a>
    </div>
    <div class="footer">© 2025 Aegis. All rights reserved.</div>
  </div>
</body>
</html>
